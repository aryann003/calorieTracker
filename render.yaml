# Render blueprint. The database is an external PostgreSQL (e.g. Neon) so data
# survives redeploys and does not expire: set DATABASE_URL in the dashboard.
services:
  - type: web
    name: calorie-tracker
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn --chdir mysite mysite.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: SEED_DEMO
        value: "true"
