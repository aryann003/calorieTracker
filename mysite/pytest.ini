[pytest]
DJANGO_SETTINGS_MODULE = mysite.settings
python_files = tests.py test_*.py
addopts = -q --reuse-db
env =
    D:SECRET_KEY=test-secret-key-that-is-long-enough-0123456789
    D:DEBUG=False
    D:DATABASE_URL=postgres://calorie:calorie@localhost:5432/calorie
    D:ALLOWED_HOSTS=localhost,127.0.0.1,testserver
